server {
    listen       $PORT default_server;
    listen       [::]:$PORT default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip text assets — faster transfer for first paint
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # DNS resolver — required because the proxy_pass directives below use
    # a variable ($API_BASE_URL). Without a resolver, nginx can't look up
    # the upstream at request time and returns 500. Cloudflare (1.1.1.1)
    # and Google (8.8.8.8) are both reachable from Render containers.
    # Short TTL so we pick up upstream IP changes quickly.
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Long-lived caching for hashed assets (Vite already adds content hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Don't cache the entry HTML — must always pull the latest hashed asset URLs
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SEO: sitemap is generated dynamically by the backend so it always
    # reflects the current approved-property catalogue. $API_BASE_URL is
    # supplied at container start (production value:
    # https://api.joseforland.com). Falls back to a 404 if the env var isn't
    # set — better than serving stale data.
    location = /sitemap.xml {
        proxy_pass $API_BASE_URL/api/seo/sitemap.xml;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap-properties.xml {
        proxy_pass $API_BASE_URL/api/seo/sitemap-properties.xml;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        add_header Cache-Control "public, max-age=3600";
    }

    # Property images — backend serves /media from its Render disk.
    # Property.Images values are relative ("/media/...") so they resolve
    # against the page origin; nginx forwards them through to the API.
    location /media/ {
        proxy_pass $API_BASE_URL;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        # Backend already sets long Cache-Control, but be explicit at the
        # edge too so a CDN in front (Cloudflare, Render Edge) caches.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing: any unmatched path falls through to index.html so
    # React Router can handle it (e.g. direct hit on /properties/1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint Render can poll
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hide server signature
    server_tokens off;
}
